name: Build Android ARM64

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  NDK_VERSION: "r26d"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SCons
        run: pip install scons

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Set NDK Environment Path
        run: |
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Fetch godot-cpp (Master for 4.8)
        run: |
          if [ ! -d "godot-cpp/src" ]; then
            echo "📥 جاري استنساخ godot-cpp..."
            git clone --depth 1 -b master https://github.com/godotengine/godot-cpp.git godot-cpp
          fi

      - name: Cache godot-cpp
        id: cache-godot-cpp
        uses: actions/cache@v4
        with:
          path: |
            godot-cpp/bin
            godot-cpp/gen
            godot-cpp/include/godot_cpp/gen
          key: godot-cpp-android-arm64-v48-r26d-cache

      - name: Build godot-cpp (Once)
        if: steps.cache-godot-cpp.outputs.cache-hit != 'true'
        run: |
          cd godot-cpp
          scons platform=android target=template_debug arch=arm64 ANDROID_NDK_ROOT="${{ steps.setup-ndk.outputs.ndk-path }}" -j$(nproc)
          cd ..

      - name: Compile C++ Core
        run: |
          scons platform=android target=template_debug arch=arm64 ANDROID_NDK_ROOT="${{ steps.setup-ndk.outputs.ndk-path }}" -j$(nproc)

      - name: Upload Library
        uses: actions/upload-artifact@v4
        with:
          name: libcarstudio-android-arm64
          path: bin/android/*.so
