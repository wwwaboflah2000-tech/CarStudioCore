name: ⚡ Fast Android Build (1-Time godot-cpp Baking)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  NDK_VERSION: "26.3.11579264"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 استنساخ المشروع مع الـ Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 🐍 إعداد Python & SCons
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ⚙️ تثبيت SCons
        run: pip install scons

      - name: 📱 تثبيت وإعداد Android NDK
        uses: nvm-sh/setup-android@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: 🔒 فحص واسترجاع كاش godot-cpp المطبوخة
        id: cache-godot-cpp
        uses: actions/cache@v4
        with:
          path: |
            godot-cpp/bin
            godot-cpp/gen
            godot-cpp/include/godot_cpp/gen
          key: godot-cpp-android-arm64-${{ hashFiles('godot-cpp/**') }}

      - name: 🍳 طبخ مكتبة godot-cpp (مرة واحدة فقط)
        if: steps.cache-godot-cpp.outputs.cache-hit != 'true'
        run: |
          echo "🔥 يتم الآن طبخ مكتبة godot-cpp لأول مرة..."
          cd godot-cpp
          scons platform=android target=template_debug arch=arm64 -j$(nproc)
          cd ..

      - name: ⚡ بناء كود النواة C++ الخاص بك
        run: |
          echo "🚀 جاري بناء C++ الخاص بمشروعك في ثوانٍ معدودة..."
          scons platform=android target=template_debug arch=arm64 -j$(nproc)

      - name: 📦 تصدير ملف المكتبة .so
        uses: actions/upload-artifact@v4
        with:
          name: libcarstudio-android-arm64
          path: project/bin/android/*.so
